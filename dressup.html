<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมแต่งตัวของน้องตัง</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#db2777">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dressup.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>👗 เกมแต่งตัวของน้องตัง</h1>
    <p>เลือกเพศ แล้วเลือกชุดที่ชอบมาใส่ให้ตัวละครได้เลย!</p>
  </header>

  <div class="panel">
    <label style="display:block; margin-bottom:8px;">🎮 เลือกเกม:</label>
    <div class="row">
      <button class="game-select-btn" onclick="location.href='index.html'">🧩 ต่อจิ๊กซอธงชาติ</button>
      <button class="game-select-btn" onclick="location.href='garden.html'">🌷 สวนดอกไม้</button>
      <button class="game-select-btn active">👗 แต่งตัว</button>
    </div>
  </div>

  <div class="panel">
    <label style="display:block; margin-bottom:8px;">เลือกเพศตัวละคร:</label>
    <div class="row">
      <button class="gender-btn active" id="maleBtn">👦 ชาย</button>
      <button class="gender-btn" id="femaleBtn">👧 หญิง</button>
    </div>
  </div>

  <div class="panel doll-panel">
    <div class="doll-stage">
      <div class="doll">
        <div class="doll-hair" id="dollHair"></div>
        <div class="doll-head"></div>
        <div class="doll-shirt" id="dollShirt"></div>
        <div class="doll-bottom" id="dollBottom"></div>
        <div class="doll-legs" id="dollLegs"></div>
      </div>
    </div>
    <p id="outfitName" style="text-align:center; font-weight:700; color:#475569; margin-top:10px;"></p>
    <button class="btn ghost" id="randomOutfitBtn" style="width:100%; margin-top:6px;">🎲 สุ่มชุด</button>
  </div>

  <div class="panel">
    <div class="row">
      <button class="gender-btn active" id="presetModeBtn">👚 ชุดสำเร็จรูป</button>
      <button class="gender-btn" id="sandboxModeBtn">🎨 สร้างชุดเอง</button>
    </div>
  </div>

  <div class="panel" id="presetPanel">
    <label style="display:block; margin-bottom:8px;">👚 เลือกชุด:</label>
    <div id="outfitGrid" class="outfit-grid"></div>
  </div>

  <div class="panel" id="sandboxPanel" style="display:none;">
    <label style="display:block; margin-bottom:8px;">👕 สีเสื้อ:</label>
    <div id="shirtColorRow" class="swatch-row"></div>
    <label style="display:block; margin:14px 0 8px;">ส่วนล่าง:</label>
    <div class="row" style="margin-bottom:10px;">
      <button class="gender-btn active" id="pantsTypeBtn">👖 กางเกง</button>
      <button class="gender-btn" id="skirtTypeBtn">👗 กระโปรง</button>
    </div>
    <div id="bottomColorRow" class="swatch-row"></div>
  </div>

  <footer>เล่นได้ฟรี ไม่เก็บข้อมูลขึ้นเซิร์ฟเวอร์ — ชุดที่เลือกไว้บันทึกในเครื่องนี้เท่านั้น</footer>
</div>

<script src="dressup.js"></script>
</body>
</html>
