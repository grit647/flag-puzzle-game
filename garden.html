<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สวนดอกไม้ของน้องตัง</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#16a34a">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="garden.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌷 สวนของน้องตัง</h1>
    <p>ปลูกเมล็ด รดน้ำ 2 ครั้ง อาจได้ดอกไม้หรือต้นไม้ เก็บสะสมให้ครบทุกแบบ!</p>
  </header>

  <div class="panel">
    <label style="display:block; margin-bottom:8px;">🎮 เลือกเกม:</label>
    <div class="row">
      <button class="game-select-btn" onclick="location.href='index.html'">🧩 ต่อจิ๊กซอธงชาติ</button>
      <button class="game-select-btn active">🌷 สวนดอกไม้</button>
    </div>
  </div>

  <div class="panel">
    <h3 style="margin-top:0;">🧺 เก็บได้ทั้งหมด: <span id="totalCount">0</span> ชิ้น</h3>
    <p style="margin:0 0 6px; font-size:13px; color:#64748b; font-weight:700;">🌸 ดอกไม้</p>
    <div id="collectionRow" class="collection-row"></div>
    <p style="margin:12px 0 6px; font-size:13px; color:#64748b; font-weight:700;">🌳 ต้นไม้</p>
    <div id="treeCollectionRow" class="collection-row"></div>
    <p style="margin:12px 0 6px; font-size:13px; color:#9333ea; font-weight:700;">✨ ของแฟนตาซี (หายาก!)</p>
    <div id="fantasyCollectionRow" class="collection-row"></div>
    <button class="btn ghost" id="reviewBtn" style="width:100%; margin-top:14px;">🖼️ ดูสวนของฉัน (รีวิว)</button>
  </div>

  <div class="garden-scene" id="gardenScene">
    <button class="daynight-btn" id="daynightBtn">🌙 กลางคืน</button>
    <div class="sky" id="skyEl">
      <div class="stars" id="starsEl"></div>
      <div class="sun" id="sunEl">☀️</div>
      <div class="moon" id="moonEl">🌙</div>
      <div class="cloud cloud1">☁️</div>
      <div class="cloud cloud2">☁️</div>
      <div class="butterfly bfly1">🦋</div>
      <div class="butterfly bfly2">🦋</div>
      <div class="bee">🐝</div>
    </div>
    <div class="ground">
      <div class="grass-edge">🌾🌷🌱🌻🌱🌾🌼🌱🌷🌾🌱🌻🌾🌼🌱🌷🌾</div>
      <div id="gardenGrid" class="garden-grid"></div>
    </div>
  </div>

  <footer>เล่นได้ฟรี ไม่เก็บข้อมูลขึ้นเซิร์ฟเวอร์ — สถิติบันทึกไว้ในเครื่องนี้เท่านั้น</footer>
</div>

<div class="modal-overlay" id="reviewModal" style="display:none;">
  <div class="modal-box review-box">
    <h2>🖼️ สวนของฉัน</h2>
    <p id="reviewEmptyMsg" style="color:#64748b; font-size:13px;"></p>
    <div id="reviewGarden" class="review-garden"></div>
    <button class="btn" id="reviewCloseBtn" style="margin-top:12px; width:100%;">ปิด</button>
  </div>
</div>

<script src="garden.js"></script>
</body>
</html>
